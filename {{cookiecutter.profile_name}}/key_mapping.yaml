# only parameters defined in key_mapping (see below) are passed to the command in the order specified.
system: "{{cookiecutter.cluster_system}}" #check if system is defined below
log_mode: "default"  # Options: "default" or "defined"

slurm:
  command: 'sbatch --parsable {log_directive}'
  key_mapping:
    name: "--job-name={}"
    threads: "--cpus-per-task={} -n1"
    mem_mb: "--mem={}m"
    account: "--account={}"
    queue: "--partition={}"
    time_min: "--time={}"
  log_default: "--output=cluster_log/%j.out --error=cluster_log/%j.err"
  log_defined:
    single: "--output={log} --error={log}"
    split: "--output={stdout} --error={stderr}"

pbs:
  command: "qsub {log_directive}"
  key_mapping:
    name: "-N {}"
    account: "-A {}"
    queue: "-q {}"
    threads: "-l nodes=1:ppn={}" # always use 1 node
    mem_mb: "-l mem={}mb"
    time_min: "-l walltime={}00" #min= seconds x 100
  log_default: "-o cluster_log/$PBS_JOBID.out -e cluster_log/$PBS_JOBID.err"
  log_defined:
    single: "-o {log} -e {log}"
    split: "-o {stdout} -e {stderr}"

lsf:
  command: "bsub {log_directive}"
  key_mapping:
    queue: "-q {}"
    name: "-J {}"
    threads: "-n {}"
    mem_mb: '-R "rusage[mem={}]" -C1'
    account: "-P {}"
  log_default: "-o cluster_log/%J.log -e cluster_log/%J.log"
  log_defined:
    single: "-o {log} -e {log}"
    split: "-o {stdout} -e {stderr}"



# for other cluster systems see: https://slurm.schedmd.com/rosetta.pdf
